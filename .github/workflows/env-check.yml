name: env-check

# Temporary. Checks that the production Environment holds the three secrets, and that a job can reach
# it under pull_request_target, which is how the gate runs. It prints names only and checks out no code.
on:
  workflow_dispatch:
  pull_request_target:
    branches: [main]

permissions: {}

jobs:
  check:
    name: env check
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: production
    steps:
      - name: Check each secret by name
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATE_TOKEN: ${{ secrets.GATE_TOKEN }}
        run: |
          failed=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GATE_TOKEN; do
            if [ -n "${!name}" ]; then
              echo "$name present"
            else
              echo "$name missing"
              failed=1
            fi
          done
          exit "$failed"
